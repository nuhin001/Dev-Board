<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBoard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <style>

    </style>
</head>

<body class="">
    <header class=" w-11/12 flex justify-between items-center my-6 mx-auto bg-slate-100 px-6 py-4 roun rounded-2xl">
        <nav class="flex items-center gap-2">
            <img src="assets/logo.png" alt="">
            <h2 class="font-bold text-black text-4xl">DevBoard</h2>
        </nav>
        <div class="flex items-center gap-9">
            <div class="box flex items-center gap-2 bg-white px-4 py-4 rounded-4xl">
                <img src="assets/checkbox.png" alt="">
                <h5 id="" class="font-bold text-3xl">23</h5>

            </div>
            <button class="btn rounded-full"><img class="w-8 " src="assets/theme-btn.png" alt=""></button>
        </div>

    </header>


    <main class="w-11/12 mx-auto my-6">
        <section class="w-11/12 flex justify-between items-center mx-auto">
            <!-- normal box -->
            <div class="box flex items-center gap-6">
                <!-- div-box1 -->
                <div class=" flex items-center gap-2 bg-slate-100 px-5 py-8 rounded-xl ">
                    <img class="bg-white px-2 py-2" src="assets/checkbox.png" alt="" srcset="">
                    <div>
                        <h3 class="font-medium text-sm">Task Assigned</h3>
                        <p id="" class="font-bold text-3xl">05</p>
                    </div>

                </div>
                <!-- div box-2 -->
                <div class=" flex py-6 px-6  gap-1 bg-gradient-to-r from-[#3752FD]
                         to-[#9BA8F8]  rounded-xl">
                    <img src="assets/board.png" alt="">
                    <div class="">
                        <h3 class="font-medium text-3xl text-white  ">
                            Discover Something<br>New Today!</h3>
                    </div>
                </div>
                <!-- div box-3 -->
                <div class="flex items-center gap-2 bg-slate-100 px-5 py-8 rounded-xl  ">
                    <img class="bg-white px-2 py-2" src="assets/calender.png" alt="">
                    <div>
                        <h3 class="font-semibold text-xl">Wed , <br>
                            Jul 28 2025 </h3>
                    </div>
                </div>
            </div>

            <!-- container-box -->
            <div class=" bg-slate-50 px-10 pt-6 pb-44 rounded-2xl text-center">
                <!-- activity log -->
                 <div class="flex gap-4 mb-4">
                    <img src="assets/activity.png" alt="">
                    <h2  class="font-medium text-xl text-[#00303C]">Activity Log</h2>
                 </div>
                 <button class="btn btn-primary">Clear History</button>

            </div>
        </section>

    </main>


    <script src="index.js"></script>
</body>

</html>
